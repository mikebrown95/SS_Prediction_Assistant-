<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>SSDI Predictor</title>
    <link rel="stylesheet" href="/styles.css">
  </head>
  <body>
    <main class="shell">
      <section class="workspace" aria-label="SSDI probability estimator">
        <form id="prediction-form" class="panel">
          <div class="heading">
            <p class="eyebrow">Prototype estimator</p>
            <h1>SSDI award probability</h1>
            <p class="notice">For planning only. This application does not provide legal advice or an SSA determination.</p>
          </div>

          <div class="grid">
            <label>
              Age
              <input name="age" type="number" min="18" max="67" value="52" required>
            </label>

            <label>
              Date disability began
              <input name="dateOfDisability" type="date" value="2025-01-01">
            </label>

            <label>
              Sex
              <select name="sex">
                <option value="female">Female</option>
                <option value="male">Male</option>
                <option value="another">Another identity</option>
                <option value="prefer_not_to_say">Prefer not to say</option>
              </select>
            </label>

            <label>
              State or territory
              <select name="state">
                <option value="AL">Alabama</option>
                <option value="AK">Alaska</option>
                <option value="AZ">Arizona</option>
                <option value="AR">Arkansas</option>
                <option value="CA">California</option>
                <option value="CO">Colorado</option>
                <option value="CT">Connecticut</option>
                <option value="DE">Delaware</option>
                <option value="DC">District of Columbia</option>
                <option value="FL">Florida</option>
                <option value="GA">Georgia</option>
                <option value="HI">Hawaii</option>
                <option value="ID">Idaho</option>
                <option value="IL">Illinois</option>
                <option value="IN">Indiana</option>
                <option value="IA">Iowa</option>
                <option value="KS">Kansas</option>
                <option value="KY">Kentucky</option>
                <option value="LA">Louisiana</option>
                <option value="ME">Maine</option>
                <option value="MD">Maryland</option>
                <option value="MA">Massachusetts</option>
                <option value="MI">Michigan</option>
                <option value="MN">Minnesota</option>
                <option value="MS">Mississippi</option>
                <option value="MO">Missouri</option>
                <option value="MT">Montana</option>
                <option value="NE">Nebraska</option>
                <option value="NV">Nevada</option>
                <option value="NH">New Hampshire</option>
                <option value="NJ">New Jersey</option>
                <option value="NM">New Mexico</option>
                <option value="NY">New York</option>
                <option value="NC">North Carolina</option>
                <option value="ND">North Dakota</option>
                <option value="OH">Ohio</option>
                <option value="OK">Oklahoma</option>
                <option value="OR">Oregon</option>
                <option value="PA">Pennsylvania</option>
                <option value="PR">Puerto Rico</option>
                <option value="RI">Rhode Island</option>
                <option value="SC">South Carolina</option>
                <option value="SD">South Dakota</option>
                <option value="TN">Tennessee</option>
                <option value="TX">Texas</option>
                <option value="UT">Utah</option>
                <option value="VT">Vermont</option>
                <option value="VA">Virginia</option>
                <option value="WA">Washington</option>
                <option value="WV">West Virginia</option>
                <option value="WI">Wisconsin</option>
                <option value="WY">Wyoming</option>
              </select>
            </label>

            <label>
              Education
              <select name="education">
                <option value="less_than_high_school">Less than high school</option>
                <option value="high_school">High school</option>
                <option value="some_college">Some college</option>
                <option value="bachelors">Bachelor's</option>
                <option value="graduate">Graduate degree</option>
              </select>
            </label>

            <label>
              Primary condition
              <select name="condition">
                <option value="musculoskeletal">Musculoskeletal</option>
                <option value="mental_health">Mental health</option>
                <option value="cardiovascular">Cardiovascular</option>
                <option value="neurological">Neurological</option>
                <option value="cancer">Cancer</option>
                <option value="respiratory">Respiratory</option>
                <option value="immune">Immune disorder</option>
                <option value="endocrine">Endocrine</option>
                <option value="other">Other</option>
              </select>
            </label>

            <label>
              Expected impairment duration, months
              <input name="impairmentMonths" type="number" min="0" max="600" value="18" required>
            </label>

            <label>
              Years worked
              <input name="yearsWorked" type="number" min="0" max="50" value="24" required>
            </label>

            <label>
              Current average monthly earnings
              <input name="monthlyEarnings" type="number" min="0" max="100000" value="0" required>
            </label>

            <label>
              Prior work level
              <select name="workLevel">
                <option value="none">No recent work</option>
                <option value="sedentary">Sedentary</option>
                <option value="light">Light</option>
                <option value="medium">Medium</option>
                <option value="heavy">Heavy</option>
              </select>
            </label>
          </div>

          <div class="checks">
            <label class="check">
              <input name="isBlind" type="checkbox">
              Statutorily blind
            </label>
            <label class="check">
              <input name="expectedToResultInDeath" type="checkbox">
              Condition is expected to result in death
            </label>
            <label class="check">
              <input name="hasSpecialistEvidence" type="checkbox" checked>
              Specialist medical evidence available
            </label>
            <label class="check">
              <input name="hasRecentWorkAttempt" type="checkbox">
              Recent sustained work attempt
            </label>
          </div>

          <button type="submit">Estimate probability</button>
          <p id="error" class="error" role="alert"></p>
        </form>

        <aside class="result" aria-live="polite">
          <div>
            <p class="eyebrow">Estimated probability</p>
            <div id="probability" class="probability">--</div>
            <div id="band" class="band">Submit the form to estimate</div>
          </div>
          <div class="meter" aria-hidden="true">
            <div id="meter-fill"></div>
          </div>
          <div>
            <h2>Key factors</h2>
            <ul id="factors" class="factors"></ul>
          </div>
          <div>
            <h2>SSA rule screens</h2>
            <ul id="rule-findings" class="rules"></ul>
          </div>
          <div>
            <h2>Award level</h2>
            <div id="predicted-level" class="predicted-level">--</div>
            <ul id="award-levels" class="levels"></ul>
          </div>
        </aside>
      </section>
    </main>
    <script src="/app.js"></script>
  </body>
</html>
